<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<title>Offline · Racked</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(600px 300px at 50% -60px, rgba(255,90,54,.18), transparent 70%), #0a0a0c;
    color: #f5f4f0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  .icon { width: 72px; height: 72px; border-radius: 24px; margin: 0 auto 18px; display: grid; place-items: center;
    background: linear-gradient(135deg,#ff7a45,#ff4b2b); color: #1a0704; }
  h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { margin: 0 auto 22px; max-width: 300px; color: #bdbcb6; line-height: 1.5; }
  button { background: #f5f4f0; color: #0a0a0c; border: 0; border-radius: 16px; padding: 15px 26px; font-weight: 800; font-size: 15px; }
</style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.5a10 10 0 0 1 4-2.3M19 12.5a10 10 0 0 0-3.5-2.1"/><circle cx="12" cy="20" r="1"/></svg>
    </div>
    <h1>No connection</h1>
    <p>Racked needs the internet to save your sets. Step closer to the gym Wi-Fi or check your data, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
