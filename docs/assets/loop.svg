<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 240" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>From tap to leaderboard: tap the NFC tag, see your history, log a set, the log_set function updates best lift and XP atomically, and the leaderboard, gym TV and feed update in realtime.</title><rect width="1280" height="240" rx="24" fill="#f7f3f3"/><rect x="28.0" y="28" width="233.6" height="184" rx="18" fill="#ffffff" stroke="#ecdede"/><text x="50.0" y="62" fill="#DC2626" font-size="14" font-weight="800" letter-spacing="2.5">1 · TAP</text><text fill="#1d1b22" font-size="21" font-weight="800" text-anchor="start"><tspan x="50.0" y="96.0">Tap the machine</tspan></text><text fill="#6b6670" font-size="15" font-weight="400" text-anchor="start"><tspan x="50.0" y="130.2">The NFC sticker (or QR</tspan><tspan x="50.0" y="151.9">code) opens that</tspan><tspan x="50.0" y="173.7">machine&#x27;s page.</tspan></text><rect x="275.6" y="28" width="233.6" height="184" rx="18" fill="#ffffff" stroke="#ecdede"/><text x="297.6" y="62" fill="#DC2626" font-size="14" font-weight="800" letter-spacing="2.5">2 · SEE</text><text fill="#1d1b22" font-size="21" font-weight="800" text-anchor="start"><tspan x="297.6" y="96.0">Your history</tspan></text><text fill="#6b6670" font-size="15" font-weight="400" text-anchor="start"><tspan x="297.6" y="130.2">Last sessions and your</tspan><tspan x="297.6" y="151.9">best lift on this</tspan><tspan x="297.6" y="173.7">machine.</tspan></text><rect x="523.2" y="28" width="233.6" height="184" rx="18" fill="#ffffff" stroke="#ecdede"/><text x="545.2" y="62" fill="#DC2626" font-size="14" font-weight="800" letter-spacing="2.5">3 · LOG</text><text fill="#1d1b22" font-size="21" font-weight="800" text-anchor="start"><tspan x="545.2" y="96.0">Log the set</tspan></text><text fill="#6b6670" font-size="15" font-weight="400" text-anchor="start"><tspan x="545.2" y="130.2">Weight and reps in a</tspan><tspan x="545.2" y="151.9">few taps, right at the</tspan><tspan x="545.2" y="173.7">machine.</tspan></text><rect x="770.8" y="28" width="233.6" height="184" rx="18" fill="#DC2626"/><text x="792.8" y="62" fill="#ffffff" font-size="14" font-weight="800" letter-spacing="2.5">4 · SERVER</text><text fill="#ffffff" font-size="21" font-weight="800" text-anchor="start"><tspan x="792.8" y="96.0">log_set() in</tspan><tspan x="792.8" y="120.2">Postgres</tspan></text><text fill="#ffffff" fill-opacity="0.9" font-size="15" font-weight="400" text-anchor="start"><tspan x="792.8" y="154.3">One atomic function</tspan><tspan x="792.8" y="176.1">updates best lift, XP</tspan><tspan x="792.8" y="197.8">and level.</tspan></text><rect x="1018.4" y="28" width="233.6" height="184" rx="18" fill="#ffffff" stroke="#ecdede"/><text x="1040.4" y="62" fill="#DC2626" font-size="14" font-weight="800" letter-spacing="2.5">5 · LIVE</text><text fill="#1d1b22" font-size="21" font-weight="800" text-anchor="start"><tspan x="1040.4" y="96.0">Everyone sees it</tspan></text><text fill="#6b6670" font-size="15" font-weight="400" text-anchor="start"><tspan x="1040.4" y="130.2">Leaderboard, gym TV and</tspan><tspan x="1040.4" y="151.9">home feed update over</tspan><tspan x="1040.4" y="173.7">Realtime.</tspan></text></svg>